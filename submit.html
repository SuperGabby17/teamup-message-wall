<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#090c0b"><title>创建你的名片 · TEAM UP</title><link rel="stylesheet" href="styles.css?v=2"><script src="config.js" defer></script><script src="vendor/supabase.js" defer></script><script src="js/common.js?v=2" defer></script><script src="js/profile-codec.js?v=1" defer></script><script src="js/submit.js?v=3" defer></script></head>
<body class="form-page"><header class="topbar"><a class="brand" href="./">TEAM UP <span>↗</span></a><a class="small-link" href="./">看看大家 ↗</a></header>
<main class="form-shell"><p class="eyebrow">YOUR NEXT CONNECTION</p><h1>先认识你，<br>再一起出发。</h1><p class="intro">填好这 5 项，让合拍的伙伴找到你。</p>
<form id="messageForm">
<div class="field"><label for="name"><span class="field-index">01</span>昵称</label><input id="name" name="name" autocomplete="nickname" required maxlength="40" placeholder="希望大家怎么称呼你？" aria-describedby="nameHint nameError"><small id="nameHint">不用真实姓名，40 字以内</small><p id="nameError" class="field-error" aria-live="polite"></p></div>
<div class="field"><label for="mbti"><span class="field-index">02</span>MBTI</label><select id="mbti" name="mbti" required aria-describedby="mbtiHint mbtiError"><option value="" disabled selected>选择你的 MBTI</option></select><small id="mbtiHint">还没测过也可以，选择「还没测／不确定」</small><p id="mbtiError" class="field-error" aria-live="polite"></p></div>
<div class="field"><label for="skills"><span class="field-index">03</span>技能</label><input id="skills" name="skills" required maxlength="100" placeholder="例如：摄影、设计、编程" aria-describedby="skillsHint skillsError"><div id="skillSuggestions" class="suggestions" role="group" aria-label="点选技能"></div><small id="skillsHint">点选或自填 1–5 项，每项最多 12 字，用逗号隔开</small><p id="skillsError" class="field-error" aria-live="polite"></p></div>
<div class="field"><label for="interests"><span class="field-index">04</span>兴趣</label><input id="interests" name="interests" required maxlength="100" placeholder="例如：音乐、电影、户外" aria-describedby="interestsHint interestsError"><div id="interestSuggestions" class="suggestions" role="group" aria-label="点选兴趣"></div><small id="interestsHint">点选或自填 1–5 项，每项最多 12 字，用逗号隔开</small><p id="interestsError" class="field-error" aria-live="polite"></p></div>
<div class="field"><label for="message"><span class="field-index">05</span>自我介绍</label><textarea id="message" name="message" required maxlength="300" rows="5" placeholder="说说你的特点，或一个想和大家一起完成的点子…" aria-describedby="messageHint messageError"></textarea><small id="messageHint"><span id="charCount">0</span> / 300</small><p id="messageError" class="field-error" aria-live="polite"></p></div>
<p class="privacy">提交后，这五项资料将公开显示在组队主页和名片墙。请确认内容；提交后暂不支持自行修改。</p>
<p id="formStatus" class="notice" role="status" aria-live="polite"></p><button id="send" type="submit" class="button full">提交我的名片 <span>↗</span></button></form>
<section id="success" class="success" hidden tabindex="-1"><span class="success-icon" aria-hidden="true">✓</span><h2>你已加入广场。</h2><p>资料已保存，会自动出现在组队主页。</p><div id="submittedProfile" class="submitted-profile"></div><a class="button full" href="https://street-character-walk-1102.red-alder-8721.chatgpt.site/">返回组队主页 ↗</a><a class="text-button" href="./">查看大家的名片 ↗</a><button id="another" type="button" class="text-button">为下一位填写</button></section></main>
<noscript><p class="notice">请启用 JavaScript，以提交个人资料。</p></noscript></body></html>
